openapi: 3.0.0
info:
  title: REST API
  version: 1.0.0
  description: Production-ready, extensible 3-Tier Express REST API starter with TypeScript, MongoDB, and Redis
servers:
  - url: /api/v1
    description: Current Server (Same-Origin)
  - url: http://localhost:4000/api/v1
    description: Local Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: API endpoints for managing Authentication
  - name: Users
    description: API endpoints for managing users
paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Create a new user with email and password.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - confirmPassword
              properties:
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                name:
                  type: string
                  example: John Doe
                  description: Optional alias; will be split into firstName and lastName if provided
                email:
                  type: string
                  format: email
                  example: testuser1@example.com
                phone:
                  type: string
                  example: '+15551234567'
                password:
                  type: string
                  format: password
                  example: Password123!
                confirmPassword:
                  type: string
                  format: password
                  example: Password123!
            example:
              firstName: John
              lastName: Doe
              email: testuser1@example.com
              phone: '+15551234567'
              password: Password123!
              confirmPassword: Password123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 64e72f3bb6dc7b001f2a8c12
                  name:
                    type: string
                    example: John Doe
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR...
  /auth/login:
    post:
      summary: Login user
      description: Authenticate user using email and password.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
            example:
              email: testuser1@example.com
              password: Password123!
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      status:
                        type: string
                        example: active
        '401':
          description: Invalid email or password
  /auth/verify-email:
    post:
      summary: Verify email address
      description: Verify email using the token received in email link
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: 3b1a8d0f19c9e829302194819a12bcde3b1a8d0f19c9e829302194819a12bcde
            example:
              token: 3b1a8d0f19c9e829302194819a12bcde3b1a8d0f19c9e829302194819a12bcde
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired verification token
  /auth/resend-verification:
    post:
      summary: Resend email verification link
      description: Resend email verification link with anti-enumeration protection
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
            example:
              email: testuser1@example.com
      responses:
        '200':
          description: Generic confirmation message
  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Send password reset link to user email with anti-enumeration protection
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
            example:
              email: testuser1@example.com
      responses:
        '200':
          description: Password reset link dispatched confirmation
  /auth/reset-password:
    post:
      summary: Reset password
      description: Reset user password using token from email link
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
                - confirmPassword
              properties:
                token:
                  type: string
                  example: 3b1a8d0f19c9e829302194819a12bcde3b1a8d0f19c9e829302194819a12bcde
                password:
                  type: string
                  format: password
                  example: NewSecurePass123!
                confirmPassword:
                  type: string
                  format: password
                  example: NewSecurePass123!
            example:
              token: 3b1a8d0f19c9e829302194819a12bcde3b1a8d0f19c9e829302194819a12bcde
              password: NewSecurePass123!
              confirmPassword: NewSecurePass123!
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired reset token
  /auth/refresh:
    post:
      summary: Refresh access token
      description: Refresh expired access token using valid refresh token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummyRefreshTokenExample
      responses:
        '200':
          description: Tokens refreshed successfully
        '401':
          description: Invalid or expired refresh token
  /auth/me:
    get:
      summary: Get current authenticated user
      description: Retrieve profile of currently authenticated user via Bearer token
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user retrieved
        '401':
          description: Missing or invalid token
  /users:
    get:
      summary: Get all users
      description: Retrieve a list of users, optionally filtered.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
          description: Filter users by status
        - in: query
          name: page
          schema:
            type: integer
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
          description: Number of results per page
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: Users list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 64e72f3bb6dc7b001f2a8c12
                        name:
                          type: string
                          example: John Doe
                        email:
                          type: string
                          example: john@example.com
                        status:
                          type: string
                          example: active
        '401':
          description: Unauthorized - Invalid or missing token
        '500':
          description: Server error
    post:
      summary: Create a new user
      description: Create a user account with name, email, and status.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - status
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  example: active
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      status:
                        type: string
                        example: active
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Invalid input
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Unauthorized
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Internal server error
  /users/{id}:
    get:
      summary: Get a user by ID
      description: Retrieve a single user by their unique ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to retrieve
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User fetched successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      status:
                        type: string
                        example: active
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Unauthorized
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: User not found
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Internal server error
    put:
      summary: Update a user
      description: Update a user's name, email, and status by ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - status
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane@example.com
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  example: inactive
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User updated successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64e72f3bb6dc7b001f2a8c12
                      name:
                        type: string
                        example: Jane Doe
                      email:
                        type: string
                        example: jane@example.com
                      status:
                        type: string
                        example: inactive
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Invalid input
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Unauthorized
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: User not found
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Internal server error
    delete:
      summary: Delete a user
      description: Delete a user by their unique ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the user to delete
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fulfilled
                  message:
                    type: string
                    example: User deleted successfully
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Invalid user ID
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: Unauthorized
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected
                  message:
                    type: string
                    example: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Internal server error
